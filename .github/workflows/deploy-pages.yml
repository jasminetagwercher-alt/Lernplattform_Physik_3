name: Validate and build site

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "index.html"
      - "assets/**"
      - ".nojekyll"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-build
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate and build
        run: npm run build

      - name: Upload compiled site
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
