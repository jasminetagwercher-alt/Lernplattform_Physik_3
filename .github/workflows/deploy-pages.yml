name: Validate, build and publish site

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "index.html"
      - "assets/**"
      - ".nojekyll"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-build-publish
  cancel-in-progress: true

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate and build
        run: npm run build

      - name: Publish compiled files
        run: |
          rm -rf assets
          cp -R dist/assets assets
          cp dist/index.html index.html
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A index.html assets .nojekyll

          if git diff --cached --quiet; then
            echo "Published files are already current."
          else
            git commit -m "chore: publish verified site [skip ci]"
            git push
          fi
